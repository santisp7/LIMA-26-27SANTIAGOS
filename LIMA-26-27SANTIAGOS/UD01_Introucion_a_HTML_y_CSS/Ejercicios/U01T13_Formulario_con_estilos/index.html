<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="author" content="Santiago">
    <title>Registro en Actividad Formativa</title>
    
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="form-container">
    <h2>Registro en Actividad Formativa</h2>
    <form>
        
        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" required 
                   pattern="^[A-ZÁÉÍÓÚÑÇ][a-zA-ZáéíóúñçÁÉÍÓÚÑÇ\s\-]{2,29}" 
                   placeholder="Ej: Luis">
        </div>

       
        <div class="form-group">
            <label for="apellidos">Apellidos *</label>
            <input type="text" id="apellidos" required 
                   pattern="^[A-ZÁÉÍÓÚÑÇ][a-zA-ZáéíóúñçÁÉÍÓÚÑÇ\s\-]{2,49}" 
                   placeholder="Ej: Janeiro Rodríguez">
        </div>

        
        <div class="form-group">
            <label for="correo">Correo electrónico *</label>
            <input type="email" id="correo" required 
                   placeholder="Ej: alumno@correo.com">
        </div>

        
        <div class="form-group">
            <label for="edad">Edad *</label>
            <input type="number" id="edad" required min="16" max="99" 
                   placeholder="Entre 16 y 99 años">
        </div>

        
        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" 
                   pattern="^[0-9]{9}$" 
                   placeholder="9 dígitos (Opcional)">
        </div>

        
        <div class="form-group">
            <label for="cp">Código postal *</label>
            <input type="text" id="cp" required 
                   pattern="^[0-9]{5}" 
                   placeholder="5 dígitos (Ej: 28001)">
        </div>

        
        <div class="form-group">
            <label for="hermanos">Número de hermanos</label>
            <input type="number" id="hermanos" min="0" max="15" 
                   placeholder="Entre 0 y 15 (Opcional)">
        </div>

      
        <div class="form-group">
            <label for="web">Página web personal</label>
            <input type="url" id="web" 
                   placeholder="https://ejemplo.com (Opcional)">
        </div>

        <div class="buttons">
            <button type="submit">Enviar</button>
            <button type="reset">Restablecer</button>
        </div>
    </form>
</div>

</body>
</html>
