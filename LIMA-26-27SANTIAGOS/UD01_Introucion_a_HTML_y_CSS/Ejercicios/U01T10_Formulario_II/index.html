<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Formulario de Práctica - HTML5</title>
</head>
<body>

    <h1>Formulario de Registro</h1>
    <p>Por favor, introduce tus datos para continuar.</p>

    
    <form action="/procesar-datos" method="post">
        
       
        <fieldset>
            <legend>Información de Cuenta</legend>
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="user_name" size="30" placeholder="Ej. Santiago Sánchez" />
            </p>
            <p>
                <label for="clave">Contraseña:</label>
               
                <input type="password" id="clave" name="user_password" size="20" />
            </p>
        </fieldset>

       
        <fieldset>
            <legend>Preferencias y Encuesta</legend>
            
            
            <p><strong>Tecnologías que conoces (puedes marcar varias):</strong></p>
            <p>
                <input type="checkbox" id="html5" name="tecnologias" value="html5" checked="checked" />
                <label for="html5">HTML5</legend>
                
                <input type="checkbox" id="css3" name="tecnologias" value="css3" />
                <label for="css3">CSS3</legend>
                
                <input type="checkbox" id="js" name="tecnologias" value="javascript" />
                <label for="js">JavaScript</legend>
            </p>

            
            <p><strong>¿Cuál es tu nivel de experiencia actual?</strong></p>
            <p>
                <input type="radio" id="principiante" name="nivel_experiencia" value="bajo" checked="checked" />
                <label for="principiante">Principiante</label>
                
                <input type="radio" id="intermedio" name="nivel_experiencia" value="medio" />
                <label for="intermedio">Intermedio</label>
                
                <input type="radio" id="avanzado" name="nivel_experiencia" value="alto" />
                <label for="avanzado">Avanzado</label>
            </p>
        </fieldset>

        
        <p>
            
            <input type="submit" value="Enviar Registro" />
            
            <input type="reset" value="Limpiar Formulario" />
        </p>

    </form>

</body>
</html>
